name: Arunika POS CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-tests:
    name: Backend Tests (Laravel 13 & PHP 8.4)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_sqlite, bcmath, zip
          coverage: none

      - name: Copy .env
        working-directory: ./pos-backend
        run: cp .env.example .env

      - name: Install Composer Dependencies
        working-directory: ./pos-backend
        run: composer install --prefer-dist --no-interaction --optimize-autoloader

      - name: Generate App Key
        working-directory: ./pos-backend
        run: php artisan key:generate

      - name: Run Migrations
        working-directory: ./pos-backend
        run: |
          touch database/database.sqlite
          php artisan migrate --force

      - name: Execute Backend Tests
        working-directory: ./pos-backend
        run: php artisan test

  forecasting-tests:
    name: Forecasting Engine Tests (FastAPI & Python 3.11)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        working-directory: ./forecasting-engine
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Forecasting Unit Tests
        working-directory: ./forecasting-engine
        run: python -m unittest test_main.py

  frontend-builds:
    name: Frontend Build Validations
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [pos-frontend, cafe-frontend]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: './${{ matrix.app }}/package-lock.json'

      - name: Install Dependencies
        working-directory: ./${{ matrix.app }}
        run: npm ci

      - name: Build Application
        working-directory: ./${{ matrix.app }}
        run: npm run build
